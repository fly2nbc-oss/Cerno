[package]
name = "cerno"
version = "1.7.0"
edition = "2024"
description = "Fast photo viewer and culling tool: instant switching, 1-5 star ratings, automatic sharpness and aesthetics scoring"
license = "Apache-2.0"
repository = "https://github.com/fly2nbc-oss/Cerno"
readme = "README.md"
keywords = ["photo", "viewer", "culling", "rating", "heic"]
categories = ["multimedia::images"]

[features]
default = []
# HEIC/HEIF decoding via libheif (vcpkg on Windows, system libheif >= 1.17 on Linux).
heic = ["dep:libheif-rs"]
# Experimental GPU inference on Linux through ONNX Runtime's WebGPU (Vulkan) provider – the
# only vendor-neutral path, so the one that covers AMD cards. Windows always uses DirectML.
webgpu = ["ort/webgpu"]
# Video playback with sound inside Cerno through GStreamer (Windows: the official MSVC build,
# shipped beside the exe; Linux: the distribution's packages).
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-pbutils", "dep:gstreamer-video"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.36.2"
env_logger = "0.11.11"
fast_image_resize = "6.1.0"
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-pbutils = { version = "0.25.4", optional = true }
gstreamer-video = { version = "0.25.4", optional = true, features = ["v1_18"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff", "webp", "bmp", "gif"] }
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }
log = "0.4.34"
memchr = "2.8.3"
moxcms = "0.7"
# Prebuilt ONNX Runtime is downloaded at build time; rustls instead of native TLS avoids
# openssl on Linux.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-27"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
# UI language default: the system locale (Windows, Linux, macOS).
sys-locale = "0.3"
# The system's certificate store (`platform-verifier`, still rustls): an antivirus or company
# proxy that inspects HTTPS puts its root there, and the model download has to get through.
ureq = { version = "3.4.2", features = ["platform-verifier"] }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[target.'cfg(windows)'.dependencies]
# DirectML runs on every DX12 GPU (AMD, Intel, NVIDIA).
ort = { version = "2.0.0-rc.13", default-features = false, features = ["directml"] }
# The programs Windows offers for a file type ("Open with"), for editing a photo elsewhere.
# The same version wgpu already brings in.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/icon.ico and the version info into the exe (uses the Windows SDK's rc.exe).
winresource = "0.1.31"

# Windows: `cargo install cargo-vcpkg && cargo vcpkg build` builds libheif into target/vcpkg.
# Dynamic triplet so libheif and libde265 (LGPL-3.0) stay replaceable DLLs next to the exe.
# `core` leaves out the default x265 *encoder* (GPL); decoding uses libde265.
# `VCPKGRS_DYNAMIC=1` is set in `.cargo/config.toml`; `build.rs` copies the DLLs.
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "b30c88338f4ec47a322a81f4113d7385702e03a7" # master 2026-09-22: libheif 1.23.5, libde265 1.1.3 (no vcpkg tag since 2026.07.29)
dependencies = ["libheif[core]"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows" }

# Windows installer (NSIS) via cargo-packager. It packs the folder that
# `packaging/windows/stage.ps1` assembles – the same folder the portable zip holds.
[package.metadata.packager]
product-name = "Cerno"
identifier = "io.github.fly2nbc-oss.cerno"
publisher = "fly2nbc-oss"
authors = ["fly2nbc-oss <fly2nbc@gmail.com>"]
homepage = "https://github.com/fly2nbc-oss/Cerno"
category = "Photography"
formats = ["nsis"]
binaries-dir = "dist/windows/Cerno"
out-dir = "dist/windows"
resources = ["dist/windows/Cerno/*.dll", "dist/windows/Cerno/licenses", "dist/windows/Cerno/gstreamer-1.0"]

# Per-user install into %LOCALAPPDATA%\Cerno, no admin rights. Cerno's own data is
# %LOCALAPPDATA%\Cerno\data: the uninstaller deletes only the files it installed and
# removes the data folder only when the user ticks "Delete the application data".
[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"
installer-mode = "currentUser"
languages = ["English", "German", "French", "Spanish", "Italian"]
custom-language-file = { German = "packaging/windows/German.nsh", Italian = "packaging/windows/Italian.nsh" }
appdata-paths = ['$LOCALAPPDATA\$PRODUCTNAME\data']

# Linux .deb via cargo-deb (`--no-build` packs the HEIC + video release binary CI built).
# `$auto` adds the linked libraries (glibc, libstdc++, libheif1, GStreamer's core and base
# libraries) with their versions. The rest is loaded at run time with dlopen: HEVC decoding
# is a libheif plugin (Ubuntu 24.04 only suggests it), windowing and graphics come from
# winit and wgpu, and video playback needs GStreamer's plugins – containers and audio in
# base/good, the H.264/H.265 parsers in bad, FFmpeg's decoders in libav.
[package.metadata.deb]
maintainer = "fly2nbc-oss <fly2nbc@gmail.com>"
copyright = "fly2nbc-oss and contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Cerno switches between photos instantly, rates them 1-5 stars from the keyboard \
and sorts or filters them by local sharpness and aesthetics scores. Ratings and \
colour labels are written into the file as XMP without changing its dates."""
section = "graphics"
priority = "optional"
# The package version is the crate version, like the file name.
revision = ""
depends = "$auto, libheif-plugin-libde265, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxcb1, libvulkan1 | libegl1, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
# ExifTool writes the ratings; ffmpeg gives videos their frame; the UI font is read from the
# system (egui's own lacks ← →).
recommends = "libimage-exiftool-perl, ffmpeg, mesa-vulkan-drivers, xdg-desktop-portal, fonts-dejavu-core | fonts-noto-core"
assets = [
    ["target/release/cerno", "usr/bin/", "755"],
    ["packaging/linux/cerno.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/cerno.png", "644"],
    ["NOTICE", "usr/share/doc/cerno/", "644"],
    ["THIRD_PARTY.md", "usr/share/doc/cerno/", "644"],
]

# Decoding and resizing are painfully slow unoptimised; keep only our own code debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Proof of concept for playing videos inside Cerno (not shipped).
[[example]]
name = "video_poc"
required-features = ["video"]
