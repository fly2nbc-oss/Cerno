name: CI

# Pull requests: lint and tests only. Pushes to main, tags and manual runs also
# build the four packages (kept 7 days as run artifacts) and install them on clean
# systems; a `v*` tag turns them into a draft release with a build provenance
# attestation.
#
# Every action is pinned to a commit, its version as a comment: a tag that is moved
# can't bring other code into this workflow, least of all into the job with the
# SignPath token. Bumping one is by hand (AGENTS.md, "Actions pinned by commit");
# zizmor in the `scripts` job checks the workflow on every run.
#
# The caches (cargo, vcpkg's binary cache, the GStreamer installer) carry
# `zizmor: ignore[cache-poisoning]`: GitHub restores a tag's caches only from the
# tag itself or from main, and whoever can write main's cache can already change
# the release; the GStreamer installer is checked by SHA-256 before every use.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "screenshots/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      test_rounds:
        description: "How often the tests run (to measure a flaky test; every round counts)"
        default: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only the release job may write (it drafts the release).
permissions:
  contents: read

jobs:
  # Seconds: the workflow (actionlint, which also runs shellcheck over every bash `run:`
  # block, and zizmor for its security), the shell scripts (shellcheck), the PowerShell
  # scripts (PSScriptAnalyzer), and the Linux packages' desktop file and AppStream metadata.
  # Each tool is pinned by version and SHA-256 (zizmor by the action's hash-checked lock);
  # appstreamcli and desktop-file-validate come from Ubuntu.
  scripts:
    name: Lint scripts & package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          tools="$RUNNER_TEMP/lint"
          mkdir -p "$tools/bin"
          fetch() { # file url sha256
            curl -fsSL --retry 3 -o "$tools/$1" "$2"
            echo "$3  $tools/$1" | sha256sum --check --quiet
          }
          fetch actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          fetch shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          fetch PSScriptAnalyzer.nupkg \
            https://github.com/PowerShell/PSScriptAnalyzer/releases/download/1.25.0/PSScriptAnalyzer.1.25.0.nupkg \
            14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools/bin" actionlint
          tar -xJf "$tools/shellcheck.tar.xz" -C "$tools/bin" --strip-components=1 shellcheck-v0.11.0/shellcheck
          unzip -q "$tools/PSScriptAnalyzer.nupkg" -d "$tools/PSScriptAnalyzer"
          # Before the runner's own shellcheck, so actionlint uses the pinned one too.
          echo "$tools/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
      - name: Workflow (actionlint + shellcheck)
        run: |
          shellcheck --version
          actionlint -version
          actionlint -color
      # Online audits too (impostor commits, known vulnerable actions) with the run's token;
      # findings fail the job, nothing is uploaded.
      - name: Workflow security (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
      - name: Shell scripts (shellcheck)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck packaging/linux/AppRun
      - name: PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Import-Module "$env:RUNNER_TEMP/lint/PSScriptAnalyzer/PSScriptAnalyzer.psd1"
          $findings = git ls-files '*.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ }
          $findings | Format-Table -AutoSize -Wrap | Out-String -Width 200
          if ($findings) { Write-Output "::error::PSScriptAnalyzer: $(@($findings).Count) findings"; exit 1 }
      - run: desktop-file-validate packaging/linux/cerno.desktop
      # --no-net: the newest release's page exists only once its tag is pushed.
      - run: appstreamcli validate --no-net --strict --explain packaging/linux/io.github.fly2nbc_oss.cerno.metainfo.xml
      # The newest release in the AppStream file is the version in Cargo.toml, with the date of
      # its CHANGELOG.md section: a release adds its line there too.
      - name: AppStream release list is current
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          date=$(sed -n "s/^## \[${version//./\\.}\] – \([0-9-]*\).*/\1/p" CHANGELOG.md)
          newest=$(grep -o -m 1 '<release version="[^"]*" date="[^"]*"' \
            packaging/linux/io.github.fly2nbc_oss.cerno.metainfo.xml)
          if [ "$newest" != "<release version=\"$version\" date=\"$date\"" ]; then
            echo "::error::The metainfo's newest release is '$newest', expected version $version from $date"
            exit 1
          fi

  linux:
    name: Lint & test (Linux, HEIC, video)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libxkbcommon-dev libwayland-dev libimage-exiftool-perl \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked --features heic,video -- -D warnings
      # The player tests play tests/fixtures/tiny.mp4 on the CPU, without sound. A manual
      # run can repeat them (`test_rounds`); the step fails when any round failed.
      - name: Test
        env:
          ROUNDS: ${{ inputs.test_rounds || '1' }}
        run: |
          [[ "$ROUNDS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::test_rounds must be 1-99"; exit 1; }
          failed=0
          for round in $(seq 1 "$ROUNDS"); do
            if ! cargo test --locked --features heic,video; then
              failed=$((failed + 1))
              echo "::warning::test round $round of $ROUNDS failed"
            fi
          done
          echo "$failed of $ROUNDS test rounds failed"
          if [ "$failed" -gt 0 ]; then exit 1; fi
      # The experimental WebGPU path for the models (Linux only; ort ships a prebuilt ONNX
      # Runtime with WebGPU for x86_64 Linux): it must keep compiling, warning-free.
      - run: cargo clippy --all-targets --locked --features webgpu -- -D warnings
      # Known vulnerabilities in the locked dependencies fail the run; warnings (unmaintained,
      # yanked) are listed only.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit

  windows:
    name: Test & build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The installer (527 MB) is kept between runs: its server sometimes cuts transfers off.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ runner.temp }}/gstreamer-download
          key: gstreamer-installer-1.28.7
      - name: GStreamer
        run: ./packaging/windows/install-gstreamer.ps1 -Download "$env:RUNNER_TEMP/gstreamer-download"
      # A runner has no GPU: D3D12 runs on WARP, Windows' software device. `test_rounds`
      # repeats the tests like on Linux.
      - name: Lint & test (video)
        env:
          ROUNDS: ${{ inputs.test_rounds || '1' }}
        run: |
          if ($env:ROUNDS -notmatch '^[1-9][0-9]?$') { Write-Output "::error::test_rounds must be 1-99"; exit 1 }
          $env:PKG_CONFIG = "$env:GSTREAMER_ROOT\bin\pkg-config.exe"
          $env:PKG_CONFIG_PATH = "$env:GSTREAMER_ROOT\lib\pkgconfig"
          $env:PATH = "$env:GSTREAMER_ROOT\bin;$env:PATH"
          cargo clippy --all-targets --locked --features video -- -D warnings
          if ($LASTEXITCODE) { exit 1 }
          $rounds = [int]$env:ROUNDS
          $failed = 0
          for ($round = 1; $round -le $rounds; $round++) {
            cargo test --locked --features video
            if ($LASTEXITCODE) {
              $failed++
              Write-Output "::warning::test round $round of $rounds failed"
            }
          }
          Write-Output "$failed of $rounds test rounds failed"
          if ($failed) { exit 1 }
      # Outside pull requests the packaging job builds the release (with HEIC and video).
      - if: github.event_name == 'pull_request'
        run: cargo build --release --locked

  package-windows:
    name: Package (Windows installer, portable)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # A tag waits for two approvals in SignPath (cerno.exe, the installer), up to 30 min each.
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 150 || 90 }}
    # SignPath's secret and variable live in the `release` environment, for v* tags only.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      # SignPath's connector downloads the uploaded artifact from this run.
      actions: read
    env:
      SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      # libheif from vcpkg at the revision pinned in Cargo.toml, in target\vcpkg where
      # build.rs looks for the DLLs. Built packages are cached as vcpkg binary cache.
      VCPKG_ROOT: ${{ github.workspace }}\target\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
      # The runner image is part of the key: vcpkg's package hashes include the compiler, so a
      # new image (2026-09-30: VS 2026) rebuilds everything, and only a new key saves the result.
      - name: vcpkg revision
        id: vcpkg
        shell: bash
        run: |
          echo "rev=$(sed -n 's/^rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-windows}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ steps.vcpkg.outputs.rev }}-x64-windows-libheif-core-libde265-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ steps.vcpkg.outputs.rev }}-x64-windows-libheif-core-libde265-
      - name: libheif (vcpkg, dynamic triplet)
        env:
          REV: ${{ steps.vcpkg.outputs.rev }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Always a fresh vcpkg: rust-cache restores target\ – vcpkg's tools in it without
          # their executables – and vcpkg would take that msys2 root as extracted.
          if (Test-Path target/vcpkg) { Remove-Item -Recurse -Force target/vcpkg }
          git init -q target/vcpkg
          git -C target/vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg $env:REV
          git -C target/vcpkg checkout -q FETCH_HEAD
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          target\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          target\vcpkg\vcpkg.exe install "libheif[core,libde265]:x64-windows"
      - name: cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      # GStreamer to build against and to ship; never on PATH here, so the package's own
      # self-test (build.ps1) and the installed exe find only what they bring along.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ runner.temp }}/gstreamer-download
          key: gstreamer-installer-1.28.7
      - name: GStreamer
        run: ./packaging/windows/install-gstreamer.ps1 -Download "$env:RUNNER_TEMP/gstreamer-download"
      - name: Build (release, HEIC, video)
        run: |
          $env:PKG_CONFIG = "$env:GSTREAMER_ROOT\bin\pkg-config.exe"
          $env:PKG_CONFIG_PATH = "$env:GSTREAMER_ROOT\lib\pkgconfig"
          cargo build --release --locked --features heic,video
          if ($LASTEXITCODE) { exit 1 }
      # Code signing (README: Code signing policy): only on v* tags, and only once the SignPath
      # project exists – without its variable the packages stay unsigned, as before.
      - name: Signing not set up
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING != 'true'
        run: echo "::warning::SIGNPATH_ORGANIZATION_ID is not set – the Windows packages are unsigned."
      # The artifact configurations in SignPath check every signed file's product version
      # against this parameter (SignPath Foundation: metadata restrictions on all signed files).
      - name: Version for SignPath
        id: version
        if: env.SIGNING == 'true'
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Upload cerno.exe for signing
        id: unsigned-exe
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-exe
          path: target/release/cerno.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign cerno.exe (SignPath, approved by hand)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: cerno
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed/exe
      # The folder, the zip and the installer are built from the signed exe.
      - name: Use the signed cerno.exe
        if: env.SIGNING == 'true'
        run: Copy-Item signed/exe/cerno.exe target/release/cerno.exe -Force
      - name: Package
        run: ./packaging/windows/build.ps1
      - name: Upload the installer for signing
        id: unsigned-setup
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-setup
          path: dist/windows/cerno_*_x64-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer (SignPath, approved by hand)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: cerno
          signing-policy-slug: release-signing
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed/setup
      # The uninstaller is written at install time and stays unsigned; so do others' DLLs.
      - name: Use and check the signed files
        if: env.SIGNING == 'true'
        run: |
          $setup = Get-Item dist/windows/cerno_*_x64-setup.exe
          Copy-Item (Join-Path signed/setup $setup.Name) $setup.FullName -Force
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          foreach ($file in @((Resolve-Path dist/windows/Cerno/cerno.exe).Path, $setup.FullName)) {
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE) { Write-Error "not signed: $file"; exit 1 }
          }
          # The zip holds the same signed exe as the folder.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Get-Item dist/windows/cerno_*_x64-portable.zip).FullName)
          $inside = $zip.Entries | Where-Object { $_.FullName -match '(^|/)cerno\.exe$' } | Select-Object -First 1
          $zip.Dispose()
          if ($inside.Length -ne (Get-Item dist/windows/Cerno/cerno.exe).Length) {
            Write-Error "the portable zip holds another cerno.exe"; exit 1
          }
      - name: Install, start and uninstall
        run: >
          ./packaging/windows/test-installer.ps1
          -Setup (Get-Item dist/windows/cerno_*_x64-setup.exe).FullName
          -Photo (Resolve-Path tests/fixtures/tiny.jpg).Path
          -Video (Resolve-Path tests/fixtures/tiny.mp4).Path
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/windows/cerno_*_x64-setup.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: dist/windows/cerno_*_x64-portable.zip
          if-no-files-found: error
          retention-days: 7
      # Keeps vcpkg out of rust-cache, which saves target\ after the last step.
      - name: Drop vcpkg from the target cache
        if: always()
        run: if (Test-Path target/vcpkg) { Remove-Item -Recurse -Force target/vcpkg }

  package-linux:
    name: Package (Linux AppImage, deb)
    if: github.event_name != 'pull_request'
    # The oldest Ubuntu with libheif >= 1.17; sets the AppImage's glibc floor (2.39).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libheif-plugin-libde265 libxkbcommon-dev libwayland-dev \
            patchelf desktop-file-utils zsync libheif-examples libheif-plugin-x265 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build (release, HEIC, video)
        run: cargo build --release --locked --features heic,video
      # Also writes the AppImage's .zsync (zsyncmake from `zsync`) and runs its `--version`.
      - name: Package
        run: packaging/linux/build.sh
      - name: HEIC photo and video for the install tests
        run: |
          mkdir -p target/smoke
          heif-enc --quality 80 -o target/smoke/smoke.heic tests/fixtures/tiny.jpg
          cp tests/fixtures/tiny.mp4 target/smoke/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage
          path: |
            dist/linux/cerno_*_x86_64.AppImage
            dist/linux/cerno_*_x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb
          path: dist/linux/cerno_*_amd64.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-photo
          path: |
            target/smoke/smoke.heic
            target/smoke/tiny.mp4
          if-no-files-found: error
          retention-days: 3

  # Each package on a clean system, opening a HEIC photo under Xvfb (Cerno logs
  # when it has drawn it – the HEVC plugin is loaded with dlopen, so ldd alone
  # can't tell) and playing a video without a window (`--check-video`). The
  # AppImage gets only what every desktop has – GStreamer with its plugins among
  # it – and no libheif: it must bring its own. It runs on Ubuntu and Debian and on
  # two other families with their own GStreamer builds: Fedora (H.264 only through
  # openh264 from Fedora's Cisco repository) and Arch. The
  # .deb goes onto the bare image, so its Depends and Recommends alone must bring
  # everything Cerno loads; only Xvfb is added.
  test-linux-packages:
    name: Install test (${{ matrix.package }}, ${{ matrix.image }})
    needs: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie"]
        package: [appimage, deb]
        include:
          - image: "fedora:44"
            package: appimage
          # Arch is rolling: the step's `pacman -Syu` brings the image up to date anyway.
          - image: "archlinux:base"
            package: appimage
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      RUST_LOG: info
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{linux-*,smoke-photo}"
          merge-multiple: true
          path: pkg
      - name: System packages for the AppImage
        if: matrix.package == 'appimage'
        run: |
          # shellcheck source=/dev/null
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              apt-get update
              apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri \
                libegl1 libvulkan1 libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 \
                libxi6 libxcb1 libwayland-client0 \
                gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
              heif=$(dpkg-query -W -f='${Package} ${Status}\n' 'libheif*' 2>/dev/null | grep 'install ok' || true)
              ;;
            fedora)
              dnf install -y --setopt=install_weak_deps=False --enablerepo=fedora-cisco-openh264 \
                xorg-x11-server-Xvfb xorg-x11-xauth util-linux findutils mesa-dri-drivers mesa-vulkan-drivers \
                mesa-libEGL vulkan-loader libxkbcommon libxkbcommon-x11 libX11 libX11-xcb libXcursor libXi \
                libxcb libwayland-client \
                gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free \
                gstreamer1-plugin-libav gstreamer1-plugin-openh264 openh264
              heif=$(rpm -qa 'libheif*')
              ;;
            arch)
              pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth mesa vulkan-swrast \
                vulkan-icd-loader libxkbcommon libxkbcommon-x11 libx11 libxcursor libxi libxcb wayland \
                gst-plugins-base gst-plugins-good gst-plugins-bad gst-libav
              heif=$(pacman -Qq | grep '^libheif' || true)
              ;;
            *)
              echo "::error::No package list for $ID"
              exit 1
              ;;
          esac
          if [ -n "$heif" ]; then
            echo "libheif is installed ($heif) - the test would not show that the AppImage brings its own"
            exit 1
          fi
      - name: AppImage
        if: matrix.package == 'appimage'
        run: |
          chmod +x pkg/*.AppImage
          appimage=$(find pkg -name 'cerno_*_x86_64.AppImage')
          version=$(basename "$appimage" | cut -d_ -f2)
          said=$(APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version)
          if [ "$said" != "cerno $version" ]; then echo "--version said '$said'"; exit 1; fi
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 30 "$appimage" pkg/smoke.heic >cerno.log 2>&1 || true
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60 "$appimage" --check-video pkg/tiny.mp4
      - name: deb
        if: matrix.package == 'deb'
        run: |
          apt-get update
          apt-get install -y ./pkg/cerno_*_amd64.deb
          apt-get install -y --no-install-recommends xvfb xauth
          version=$(basename pkg/cerno_*_amd64.deb | cut -d_ -f2)
          said=$(cerno --version)
          if [ "$said" != "cerno $version" ]; then echo "--version said '$said'"; exit 1; fi
          ldd /usr/bin/cerno | tee ldd.txt
          if grep -q "not found" ldd.txt; then exit 1; fi
          xvfb-run -a timeout 30 cerno pkg/smoke.heic >cerno.log 2>&1 || true
          # Recommended fonts: egui's bundled one lacks the arrows.
          if grep -q "no system UI font found" cerno.log; then cat cerno.log; exit 1; fi
          timeout 60 cerno --check-video pkg/tiny.mp4
      - name: Cerno drew the photo
        run: |
          cat cerno.log
          grep -q "start-up: first photo drawn" cerno.log

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [scripts, linux, windows, package-windows, package-linux, test-linux-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # the signing certificate of the provenance attestation
      attestations: write # storing the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - name: Tag matches Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{windows-*,linux-*}"
          merge-multiple: true
          path: release
      # The notes are the version's CHANGELOG.md section; without one the release stops.
      - name: Checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]' (or it is empty) - the release notes come from it"
            exit 1
          fi
          cat >> notes.md <<EOF

          ### Downloads

          | File | For |
          |---|---|
          | \`cerno_${VERSION}_x64-setup.exe\` | Windows 10/11 installer – per user, no admin rights |
          | \`cerno_${VERSION}_x64-portable.zip\` | Windows portable – unzip and run \`Cerno\\cerno.exe\` |
          | \`cerno_${VERSION}_x86_64.AppImage\` | Linux portable – glibc 2.39 or newer; tested on Ubuntu 24.04, Debian 13, Fedora 44 and Arch Linux |
          | \`cerno_${VERSION}_amd64.deb\` | Ubuntu 24.04+, Debian 13+ |
          | \`cerno_${VERSION}_x86_64.AppImage.zsync\` | Not a download: lets [AppImageUpdate](https://github.com/AppImageCommunity/AppImageUpdate) fetch only what changed in the AppImage |

          Writing ratings, colour labels, comments and keywords needs [ExifTool](https://exiftool.org/): on Windows Cerno offers to download it the first time it is needed; the .deb recommends it. Videos play inside Cerno: the Windows packages bring GStreamer along, on Linux it comes from the system (the .deb depends on it).

          Every file was built by this repository's CI from the tag and carries a build provenance attestation: \`gh attestation verify <file> --repo fly2nbc-oss/Cerno\` checks it.

          Code signing policy: what is signed, by whom and how – see [Code signing policy](https://github.com/fly2nbc-oss/Cerno#code-signing-policy) in the README.
          EOF
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag
          --title "Cerno $VERSION" --notes-file notes.md